<!DOCTYPE html>
<html>
<head>
<base target="_top">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f1e6;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
position:relative;
overflow:hidden;
}

.watermark{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:80px;
font-weight:900;
line-height:1.1;
text-align:center;
color:rgba(255,90,0,0.05);
pointer-events:none;
z-index:0;
}

.header,.details-grid,table,.buttons{
position:relative;
z-index:2;
}

.header{
display:flex;
justify-content:space-between;
align-items:flex-start;
border-bottom:3px solid #ff5a00;
padding-bottom:25px;
margin-bottom:25px;
}

.left-header{
width:65%;
}

.right-header{
width:30%;
display:flex;
justify-content:center;
align-items:center;
}

.talabat-logo{
font-size:72px;
font-weight:900;
color:#ff5a00;
}

.company-details{
margin-top:15px;
line-height:1.8;
}

.company-details p:first-child{
color:#D71920;
font-weight:700;
font-size:18px;
}

#qrCode{
padding:15px;
background:#fff7f2;
border-radius:12px;
min-height:220px;
display:flex;
align-items:center;
justify-content:center;
}

.details-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-bottom:25px;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
}

.field label{
font-weight:bold;
font-size:14px;
}

input,select{
padding:12px;
border:1px solid #ddd;
border-radius:8px;
width:100%;
}

.readonly{
background:#fff7f2;
color:#ff5a00;
font-weight:bold;
text-align:center;
font-size:12px;
padding:8px;
word-break:break-word;
}

/* تمييز الخانة الناقصة باللون الأحمر */
.invalid{
border:2px solid #D71920 !important;
background:#fff5f5;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#6b0f1a;
color:white;
padding:14px;
}

td{
padding:8px;
border-bottom:1px solid #ddd;
}

.buttons{
margin-top:25px;
display:flex;
gap:15px;
}

button{
padding:14px 24px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add-btn{
background:#ff5a00;
color:white;
}

.submit-btn{
background:black;
color:white;
}

@media print{
.buttons{display:none;}
body{padding:0;background:white;}
.container{box-shadow:none;}
}


tfoot .totals-row{
background:#fff7f2;
border-top:2px solid #ff5a00;
font-size:14px;
font-weight:bold;
}

tfoot td{
padding:6px 12px;
text-align:center;
color:#111;
}

tfoot strong{
color:#ff5a00;
font-size:16px;
margin-left:6px;
}

</style>
</head>

<script>

function updateDateTime(){
const now = new Date();
document.getElementById("shipDate").innerText = now.toLocaleDateString('en-US');
document.getElementById("shipTime").innerText = now.toLocaleTimeString('en-US');
}
updateDateTime();
setInterval(updateDateTime,1000);

function addRow(){
const row=document.createElement("tr");

row.innerHTML=`
<td><input type="text" oninput="fetchItemDetails(this); updateTotals()"></td>
<td><input type="text"></td>
<td><input type="number" oninput="updateTotals()"></td>
<td><input type="text"></td>
<td><input type="text"></td>
`;

document.getElementById("tableBody").appendChild(row);
}

function fetchItemDetails(input){

const row = input.closest("tr");
const itemNumber = input.value;

if(itemNumber.length < 3) return;

google.script.run.withSuccessHandler(function(data){

row.cells[1].querySelector("input").value = data.description;
row.cells[3].querySelector("input").value = data.barcode;

}).getItemDetails(itemNumber);
}

function updateTotals(){

const rows = document.querySelectorAll("#tableBody tr");

let totalItems = 0;
let totalQty = 0;

rows.forEach(row=>{

const inputs = row.querySelectorAll("input");

if(inputs[0].value.trim() !== ""){
totalItems++;
}

totalQty += parseInt(inputs[2].value) || 0;

});

document.getElementById("totalItems").innerText = totalItems;
document.getElementById("totalQty").innerText = totalQty;
}

function validateForm(){

const stEl = document.getElementById("st");
const driverEl = document.getElementById("driver");
const storeEl = document.getElementById("store");
const reviewedByEl = document.getElementById("reviewedBy");

// نشيل أي تمييز أحمر قديم
[stEl, driverEl, storeEl, reviewedByEl].forEach(el => el.classList.remove("invalid"));

let missing = [];

if(stEl.value.replace(/\s+/g,'') === ""){
missing.push("ST Number");
stEl.classList.add("invalid");
}

if(driverEl.value === ""){
missing.push("3PL Name");
driverEl.classList.add("invalid");
}

if(storeEl.value === ""){
missing.push("Ship to Store");
storeEl.classList.add("invalid");
}

if(reviewedByEl.value === ""){
missing.push("Reviewed By");
reviewedByEl.classList.add("invalid");
}

if(missing.length > 0){
alert("⚠️ لا يمكن طباعة الفاتورة!\n\nمن فضلك أكمل البيانات التالية:\n\n- " + missing.join("\n- "));
return false;
}

return true;
}

function submitData(){

// لو البيانات الأساسية ناقصة يوقف ولا يطبع
if(!validateForm()) return;

const btn = document.querySelector(".submit-btn");

const rows=document.querySelectorAll("#tableBody tr");
let finalData=[];

rows.forEach(row=>{
const inputs=row.querySelectorAll("input");

if(inputs[0].value!==""){
finalData.push({
store:document.getElementById("store").value,
driver:document.getElementById("driver").value,
st:document.getElementById("st").value,
itemNumber:inputs[0].value,
description:inputs[1].value,
remaining:inputs[2].value,
barcode:inputs[3].value,
comment:inputs[4].value,
reviewedBy:document.getElementById("reviewedBy").value
});
}
});

// لازم صنف واحد على الأقل
if(finalData.length === 0){
alert("⚠️ لازم تضيف صنف واحد على الأقل قبل الإرسال");
return;
}

btn.innerText = "Submitting...";
btn.disabled = true;

google.script.run.withSuccessHandler(function(response){

document.getElementById("podID").innerText=response.podID;
document.getElementById("submittedBy").innerText=response.email;

document.getElementById("qrCode").innerHTML="";

new QRCode(document.getElementById("qrCode"),{
text: response.pdfUrl,
width:180,
height:180
});

btn.innerText = "Opening Print...";

setTimeout(()=>{
window.print();
location.reload();
},1000);

}).withFailureHandler(function(error){

alert("Error: " + error.message);

btn.innerText = "Submit & Print";
btn.disabled = false;

}).submitPOD(finalData);
}


// Keyboard Navigation
document.addEventListener("keydown", function(e){

const active = document.activeElement;

if(active.tagName !== "INPUT") return;

const row = active.closest("tr");
if(!row) return;

const rows = Array.from(document.querySelectorAll("#tableBody tr"));
const currentRow = rows.indexOf(row);

const cells = Array.from(row.querySelectorAll("input"));
const currentCol = cells.indexOf(active);

let target = null;

if(e.key === "Enter" || e.key === "ArrowDown"){
e.preventDefault();

if(currentRow === rows.length - 1){
addRow();
}

const updatedRows = Array.from(document.querySelectorAll("#tableBody tr"));

target = updatedRows[currentRow + 1]
?.querySelectorAll("input")[currentCol];
}

if(e.key === "ArrowUp"){
e.preventDefault();

target = rows[currentRow - 1]
?.querySelectorAll("input")[currentCol];
}

if(e.key === "ArrowRight"){
e.preventDefault();
target = cells[currentCol + 1];
}

if(e.key === "ArrowLeft"){
e.preventDefault();
target = cells[currentCol - 1];
}

if(target){
target.focus();
target.select?.();
}

});

</script>
