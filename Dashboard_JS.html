<script>
// ═══════════════════════════════════════════════════════════════════
//  Talabat Warehouse QC Dashboard — Frontend Engine (Dashboard_JS)
// ═══════════════════════════════════════════════════════════════════

/* ── Color Palette ─────────────────────────────────────────────── */
const PALETTE = {
  orange: '#FF6B00', blue: '#3B82F6', green: '#10B981',
  purple: '#8B5CF6', teal: '#06B6D4', yellow: '#F59E0B',
  rose: '#F43F5E',   indigo:'#6366F1',
  series: ['#3B82F6','#10B981','#F59E0B','#8B5CF6','#06B6D4','#F43F5E','#6366F1','#FF6B00'],
  tpl: { 'Trella':'#3B82F6', 'Logistaway':'#10B981', 'NAQLA':'#F59E0B', 'QC Warehouse Review':'#8B5CF6' },
};

/* ═══════════════════════════════════════════════════════════════
   APP STATE
   ═══════════════════════════════════════════════════════════════ */
const AppState = {
  raw: [],                 // all rows from backend
  filterOptions: {},       // { store: Set, tpl: Set, user: Set, stnum: Set }
  filters: {
    dateFrom: null, dateTo: null,
    stores: new Set(), tpls: new Set(), users: new Set(), stnums: new Set(),
  },

  trendMode: 'daily',
  actPage: 1, actPageSize: 20,
  actSort: { key: 'date', dir: -1 },
  actSearch: '',
  actRows: [],            // POD-level rows for table
  openFilters: new Set(),

  getFiltered() {
    const f = this.filters;
    const hasDateFrom = f.dateFrom != null;
    const hasDateTo   = f.dateTo   != null;
    const hasStores   = f.stores.size > 0;
    const hasTpls     = f.tpls.size > 0;
    const hasUsers    = f.users.size > 0;
    const hasStnums   = f.stnums.size > 0;
    return this.raw.filter(r => {
      if (hasDateFrom && r[1] < f.dateFrom) return false;
      if (hasDateTo   && r[1] > f.dateTo)   return false;
      if (hasStores   && !f.stores.has(r[3])) return false;
      if (hasTpls     && !f.tpls.has(r[4]))   return false;
      if (hasUsers    && !f.users.has(r[2]))   return false;
      if (hasStnums   && !f.stnums.has(r[5]))  return false;
      return true;
    });
  },

  hasActiveFilters() {
    const f = this.filters;
    return f.dateFrom || f.dateTo ||
      f.stores.size > 0 || f.tpls.size > 0 || f.users.size > 0 || f.stnums.size > 0;
  }
};

/* ═══════════════════════════════════════════════════════════════
   DATA ENGINE — pure aggregation functions
   ═══════════════════════════════════════════════════════════════ */
const DataEngine = {

  aggregate(rows) {
    const pods     = new Map();   // podId → { store, tpl, stNumber, user, date, qty, items[], reviewedBy }
    const dailyP   = new Map();   // date  → Set<podId>
    const dailyQ   = new Map();   // date  → qty
    const storeP   = new Map();   // store → Set<podId>
    const storeQ   = new Map();   // store → qty
    const itemFreq = new Map();   // desc  → count
    const itemQ    = new Map();   // desc  → qty
    const tplP     = new Map();   // 3PL   → Set<podId>
    const tplQ     = new Map();   // 3PL   → qty
    const userP    = new Map();   // user  → Set<podId>
    let revWH = 0, revTPL = 0, revNone = 0;

    for (const r of rows) {
      const [podId, date, user, store, tpl, stNum, itemNum, desc, qty, reviewed] = r;
      if (!podId) continue;

      // POD accumulation
      if (!pods.has(podId)) {
        pods.set(podId, { store, tpl, stNumber: stNum, user, date, qty: 0, items: [], reviewedBy: reviewed });
      }
      const pod = pods.get(podId);
      pod.qty += qty;
      pod.items.push({ itemNum, desc: desc || itemNum, qty });

      // Daily
      if (!dailyP.has(date)) dailyP.set(date, new Set());
      dailyP.get(date).add(podId);
      dailyQ.set(date, (dailyQ.get(date) || 0) + qty);

      // Store
      if (!storeP.has(store)) storeP.set(store, new Set());
      storeP.get(store).add(podId);
      storeQ.set(store, (storeQ.get(store) || 0) + qty);

      // Items
      const key = desc || itemNum || '(unknown)';
      itemFreq.set(key, (itemFreq.get(key) || 0) + 1);
      itemQ.set(key, (itemQ.get(key) || 0) + qty);

      // 3PL
      if (!tplP.has(tpl)) tplP.set(tpl, new Set());
      tplP.get(tpl).add(podId);
      tplQ.set(tpl, (tplQ.get(tpl) || 0) + qty);

      // User
      if (!userP.has(user)) userP.set(user, new Set());
      userP.get(user).add(podId);

      // Review
      if (reviewed === 'Warehouse QC') revWH++;
      else if (reviewed === '3PL')      revTPL++;
      else                              revNone++;
    }

    const totalPods = pods.size;
    const totalQty  = rows.reduce((s, r) => s + r[8], 0);
    const avgQty    = totalPods ? Math.round(totalQty / totalPods * 10) / 10 : 0;
    const revRate   = rows.length ? +((revWH + revTPL) / rows.length * 100).toFixed(1) : 0;
    const dates     = [...dailyP.keys()].sort();

    const top = (map, getValue, n = 10) =>
      [...map.entries()]
        .map(([l, v]) => ({ label: l, value: getValue(v) }))
        .sort((a, b) => b.value - a.value)
        .slice(0, n);

    // Latest day snapshot
    const latestDate   = dates[dates.length - 1] || '';
    const latestPodSet = dailyP.get(latestDate) || new Set();
    const latestUsers  = new Set([...pods.values()]
      .filter(p => p.date === latestDate).map(p => p.user));

    // Weekly aggregation
    const weeklyP = new Map(); const weeklyQ = new Map();
    for (const [d, ps] of dailyP) {
      const dt   = new Date(d + 'T00:00:00');
      const week = getWeekLabel(dt);
      if (!weeklyP.has(week)) weeklyP.set(week, new Set());
      ps.forEach(id => weeklyP.get(week).add(id));
      weeklyQ.set(week, (weeklyQ.get(week) || 0) + (dailyQ.get(d) || 0));
    }
    const weeks = [...weeklyP.keys()].sort();

    return {
      kpis: {
        totalPods, totalQty, activeStores: storeP.size,
        active3PL: tplP.size, activeUsers: userP.size,
        uniqueItems: itemFreq.size, stNumbers: new Set(rows.map(r => r[5])).size,
        avgQty, revRate, unreviewedCount: revNone,
      },
      snapshot: {
        date: latestDate,
        pods: latestPodSet.size,
        qty: dailyQ.get(latestDate) || 0,
        stores: new Set([...pods.values()].filter(p => p.date === latestDate).map(p => p.store)).size,
        users: latestUsers.size,
      },
      daily:  { dates, pods: dates.map(d => dailyP.get(d).size), qty: dates.map(d => dailyQ.get(d) || 0) },
      weekly: { dates: weeks, pods: weeks.map(w => weeklyP.get(w).size), qty: weeks.map(w => weeklyQ.get(w) || 0) },
      topStoresByPods: top(storeP, v => v.size),
      topStoresByQty:  top(storeQ, v => v),
      topItemsByFreq:  top(itemFreq, v => v),
      topItemsByQty:   top(itemQ,   v => v),
      tplByPods: top(tplP, v => v.size, 6),
      tplByQty:  top(tplQ, v => v, 6),
      topUsers:  top(userP, v => v.size, 8),
      reviewStatus: [
        { label: 'Warehouse QC', value: revWH },
        { label: '3PL Verified', value: revTPL },
        { label: 'Not Reviewed', value: revNone },
      ],
      podList: [...pods.entries()].map(([id, v]) => ({ id, ...v })),
    };
  },

  buildFilterOptions(rows) {
    const stores = new Set(), tpls = new Set(), users = new Set(), stnums = new Set();
    for (const r of rows) {
      if (r[3]) stores.add(r[3]);
      if (r[4]) tpls.add(r[4]);
      if (r[2]) users.add(r[2]);
      if (r[5]) stnums.add(r[5]);
    }
    return { stores: [...stores].sort(), tpls: [...tpls].sort(), users: [...users].sort(), stnums: [...stnums].sort() };
  }
};

function getWeekLabel(dt) {
  const d = new Date(dt);
  d.setDate(d.getDate() - d.getDay() + 1); // Monday
  return d.toISOString().slice(0, 10);
}

/* ═══════════════════════════════════════════════════════════════
   CHART ENGINE — Canvas 2D + SVG (zero external dependencies)
   ═══════════════════════════════════════════════════════════════ */
const ChartManager = {

  _tt: null,
  _donutCbs: {},

  _tooltip() {
    if (!this._tt) {
      this._tt = document.createElement('div');
      this._tt.style.cssText = 'position:fixed;background:#1E293B;border:1px solid #334155;border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;z-index:9999;display:none;color:#F1F5F9;min-width:140px';
      document.body.appendChild(this._tt);
    }
    return this._tt;
  },

  _showTT(e, title, rows) {
    const tt = this._tooltip();
    tt.innerHTML = `<div style="font-weight:700;margin-bottom:6px;color:#fff">${title}</div>` +
      rows.map(([k,v]) => `<div style="display:flex;justify-content:space-between;gap:16px"><span style="color:#94A3B8">${k}</span><span style="font-weight:600">${v}</span></div>`).join('');
    tt.style.display = 'block';
    this._moveTT(e);
  },

  _moveTT(e) {
    const tt = this._tooltip();
    const x = e.clientX + 14, y = e.clientY - 10;
    tt.style.left = (x + tt.offsetWidth > window.innerWidth ? x - tt.offsetWidth - 24 : x) + 'px';
    tt.style.top  = (y + tt.offsetHeight > window.innerHeight ? y - tt.offsetHeight : y) + 'px';
  },

  _hideTT() { this._tooltip().style.display = 'none'; },

  destroy(id) { /* no-op — no Chart.js instances to clean up */ },

  /* ── Horizontal bar (CSS divs) ─────────────────────────────── */
  hBar(id, labels, values, color, onClick, opts = {}) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const wrap = canvas.parentElement;
    if (!wrap) return;
    const max = Math.max(...values, 1);
    const colors = Array.isArray(color)
      ? color : Array(labels.length).fill(color || PALETTE.blue);
    wrap.innerHTML = '<div class="hbar-list">' + labels.map((l, i) => {
      const w    = (values[i] / max * 100).toFixed(1);
      const col  = colors[i % colors.length];
      const safeL = escAttr(l);
      return `<div class="hbar-item" data-idx="${i}" title="${safeL}" style="cursor:${onClick ? 'pointer' : 'default'}">
        <div class="hbar-top">
          <div class="hbar-name">${escHtml(l)}</div>
          <div class="hbar-val">${fmtNum(values[i])}${opts.unit ? ' ' + opts.unit : ''}</div>
        </div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${col}"></div></div>
      </div>`;
    }).join('') + '</div>';
    if (onClick) {
      wrap.querySelectorAll('.hbar-item').forEach(el => {
        el.addEventListener('click', () => onClick(labels[+el.dataset.idx], +el.dataset.idx));
      });
    }
  },

  highlightBar(id, activeIdx) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const wrap = canvas.parentElement;
    if (!wrap) return;
    wrap.querySelectorAll('.hbar-item').forEach((el, i) => {
      el.classList.toggle('hbar-active', activeIdx === null || i === activeIdx);
    });
  },

  /* ── Dual-axis line (Canvas 2D) ────────────────────────────── */
  dualLine(id, labels, ds1, ds2, onClick) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const dpr  = window.devicePixelRatio || 1;
    const W    = canvas.parentElement.clientWidth  || 600;
    const H    = 260;
    canvas.width  = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const ctx  = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const PAD  = { t: 28, r: 60, b: 44, l: 52 };
    const cW   = W - PAD.l - PAD.r;
    const cH   = H - PAD.t - PAD.b;
    const max1 = Math.max(...ds1, 1);
    const max2 = Math.max(...ds2, 1);
    const n    = labels.length;

    // Grid lines
    ctx.strokeStyle = 'rgba(203,213,225,.4)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = PAD.t + cH - (i / 5) * cH;
      ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(PAD.l + cW, y); ctx.stroke();
    }

    // Y-axis labels — left (PODs)
    ctx.font = '10px Segoe UI'; ctx.fillStyle = '#64748B';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 5; i++) {
      ctx.fillText(fmtShort(Math.round(i / 5 * max1)), PAD.l - 6, PAD.t + cH - (i / 5) * cH + 3);
    }
    // Y-axis labels — right (Qty)
    ctx.textAlign = 'left';
    for (let i = 0; i <= 5; i++) {
      ctx.fillText(fmtShort(Math.round(i / 5 * max2)), PAD.l + cW + 6, PAD.t + cH - (i / 5) * cH + 3);
    }

    // X-axis labels
    ctx.textAlign = 'center';
    const step = Math.max(1, Math.floor(n / 10));
    for (let i = 0; i < n; i += step) {
      const x = PAD.l + (i / (n - 1 || 1)) * cW;
      ctx.fillText(labels[i].slice(5), x, PAD.t + cH + 16);
    }

    // Draw filled area + line helper
    const drawSeries = (ds, maxV, col) => {
      if (!n) return;
      const pts = ds.map((v, i) => [PAD.l + (i / (n - 1 || 1)) * cW, PAD.t + cH - (v / maxV) * cH]);
      const grad = ctx.createLinearGradient(0, PAD.t, 0, PAD.t + cH);
      grad.addColorStop(0, col + '40'); grad.addColorStop(1, col + '08');
      ctx.beginPath();
      pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.lineTo(PAD.l + cW, PAD.t + cH); ctx.lineTo(PAD.l, PAD.t + cH);
      ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
      pts.forEach(([x, y]) => {
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = col; ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
      });
    };
    drawSeries(ds2, max2, PALETTE.orange);
    drawSeries(ds1, max1, PALETTE.blue);

    // Legend
    const leg = document.getElementById('trendLegend');
    if (leg) {
      leg.innerHTML = [
        { col: PALETTE.blue,   k: 'pods', lbl: 'PODs (Invoices)' },
        { col: PALETTE.orange, k: 'qty',  lbl: 'Quantity (Remaining Qty)' },
      ].map(s => `<div class="legend-item" id="leg-${s.k}">
        <div class="legend-dot" style="background:${s.col}"></div><span>${s.lbl}</span>
      </div>`).join('');
    }

    // Interaction
    const self = this;
    canvas.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const idx  = Math.round(((e.clientX - rect.left - PAD.l) / cW) * (n - 1));
      if (idx < 0 || idx >= n) { self._hideTT(); return; }
      self._showTT(e, labels[idx], [['PODs', fmtNum(ds1[idx])], ['Qty', fmtNum(ds2[idx])]]);
    };
    canvas.onmouseleave = () => self._hideTT();
    canvas.onclick = onClick ? (e) => {
      const rect = canvas.getBoundingClientRect();
      const idx  = Math.round(((e.clientX - rect.left - PAD.l) / cW) * (n - 1));
      if (idx >= 0 && idx < n) onClick(labels[idx]);
    } : null;
  },

  /* ── SVG Donut ─────────────────────────────────────────────── */
  donut(id, labels, values, colors, onClick) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const wrap  = canvas.parentElement;
    if (!wrap)  return;
    const total = values.reduce((s, v) => s + v, 0) || 1;
    const R = 52, r = 32, cx = 68, cy = 68, sz = 136;
    let angle = -Math.PI / 2;
    let paths = '';

    labels.forEach((l, i) => {
      const sweep = (values[i] / total) * 2 * Math.PI;
      if (sweep <= 0) return;
      const x1  = cx + R * Math.cos(angle),     y1  = cy + R * Math.sin(angle);
      angle += sweep;
      const x2  = cx + R * Math.cos(angle),     y2  = cy + R * Math.sin(angle);
      const ix1 = cx + r * Math.cos(angle - sweep), iy1 = cy + r * Math.sin(angle - sweep);
      const ix2 = cx + r * Math.cos(angle),     iy2 = cy + r * Math.sin(angle);
      const lg  = sweep > Math.PI ? 1 : 0;
      const col = colors[i] || '#94A3B8';
      const cb  = onClick ? `onclick="ChartManager._donutCbs['${id}'] && ChartManager._donutCbs['${id}']('${escAttr(l)}')"` : '';
      paths += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R},0,${lg},1,${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${r},${r},0,${lg},0,${ix1.toFixed(2)},${iy1.toFixed(2)} Z" fill="${col}" style="cursor:${onClick ? 'pointer' : 'default'};transition:opacity .15s" onmouseover="this.style.opacity=.7" onmouseout="this.style.opacity=1" ${cb}/>`;
    });

    const topIdx = values.indexOf(Math.max(...values));
    const topPct = topIdx >= 0 ? (values[topIdx] / total * 100).toFixed(0) + '%' : '';
    const topLbl = (labels[topIdx] || '').slice(0, 11);
    paths += `<text x="${cx}" y="${cy - 5}" text-anchor="middle" fill="#1E293B" font-size="13" font-weight="700" font-family="Segoe UI,sans-serif">${topPct}</text>`;
    paths += `<text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="#64748B" font-size="9" font-family="Segoe UI,sans-serif">${topLbl}</text>`;

    wrap.innerHTML = `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="display:block;margin:0 auto">${paths}</svg>`;
    if (onClick) this._donutCbs[id] = onClick;
  },

  /* ── Vertical bar (Canvas 2D) ──────────────────────────────── */
  vBar(id, labels, values, colors, onClick) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W   = canvas.parentElement.clientWidth || 500;
    const H   = 200;
    canvas.width  = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const PAD  = { t: 20, r: 14, b: 44, l: 42 };
    const cW   = W - PAD.l - PAD.r;
    const cH   = H - PAD.t - PAD.b;
    const max  = Math.max(...values, 1);
    const n    = labels.length;
    const slot = cW / n;
    const bW   = slot * 0.62;
    const bGap = slot * 0.19;

    // Grid
    ctx.font = '10px Segoe UI'; ctx.fillStyle = '#64748B';
    ctx.strokeStyle = 'rgba(203,213,225,.4)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = PAD.t + cH - (i / 4) * cH;
      ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(PAD.l + cW, y); ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(fmtShort(Math.round(i / 4 * max)), PAD.l - 4, y + 3);
    }

    // Bars
    for (let i = 0; i < n; i++) {
      const x   = PAD.l + i * slot + bGap;
      const bH  = (values[i] / max) * cH;
      const y   = PAD.t + cH - bH;
      const col = colors[i % colors.length] || PALETTE.blue;
      const grad = ctx.createLinearGradient(0, y, 0, y + bH);
      grad.addColorStop(0, col); grad.addColorStop(1, col + '88');
      ctx.fillStyle = grad;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, bW, bH, [4, 4, 0, 0]);
      else ctx.rect(x, y, bW, bH);
      ctx.fill();
      ctx.textAlign = 'center'; ctx.fillStyle = '#64748B';
      ctx.fillText(truncate(labels[i], 9), x + bW / 2, PAD.t + cH + 16);
      if (bH > 18) {
        ctx.fillStyle = '#1E293B';
        ctx.fillText(fmtShort(values[i]), x + bW / 2, y - 5);
      }
    }

    // Interaction
    const self = this;
    canvas.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const idx  = Math.floor((e.clientX - rect.left - PAD.l) / slot);
      if (idx < 0 || idx >= n) { self._hideTT(); return; }
      self._showTT(e, labels[idx], [['PODs', fmtNum(values[idx])]]);
    };
    canvas.onmouseleave = () => self._hideTT();
    canvas.onclick = onClick ? (e) => {
      const rect = canvas.getBoundingClientRect();
      const idx  = Math.floor((e.clientX - rect.left - PAD.l) / slot);
      if (idx >= 0 && idx < n) onClick(labels[idx], idx);
    } : null;
  },
};

/* ═══════════════════════════════════════════════════════════════
   RENDER FUNCTIONS
   ═══════════════════════════════════════════════════════════════ */

function renderKPIs(kpis) {
  const tiles = [
    { label:'Total PODs',       value: fmtNum(kpis.totalPods),    sub:'Unique shipments',       icon:'📦', iconBg:'#FFF7ED', alert:false },
    { label:'Total Quantity',   value: fmtNum(kpis.totalQty),     sub:'Remaining units',         icon:'📊', iconBg:'#EFF6FF', alert:false },
    { label:'Active Stores',    value: kpis.activeStores,         sub:'Branches covered',        icon:'🏪', iconBg:'#F0FDF4', alert:false },
    { label:'Active 3PL',       value: kpis.active3PL,            sub:'Logistics partners',      icon:'🚚', iconBg:'#FDF4FF', alert:false },
    { label:'Active Users',     value: kpis.activeUsers,          sub:'Team members',            icon:'👥', iconBg:'#EFF6FF', alert:false },
    { label:'Unique Items',     value: fmtNum(kpis.uniqueItems),  sub:'Distinct SKUs',           icon:'📋', iconBg:'#F0FDF4', alert:false },
    { label:'Review Rate',      value: kpis.revRate + '%',        sub: fmtNum(kpis.unreviewedCount) + ' items pending', icon:'✅', iconBg:'#FEF2F2', alert:true },
    { label:'Avg Qty / POD',    value: kpis.avgQty,               sub:'Average units per shipment', icon:'⚖️', iconBg:'#FFFBEB', alert:false },
  ];
  document.getElementById('kpiGrid').innerHTML = tiles.map(t => `
    <div class="kpi-card${t.alert ? ' kpi-alert' : ''}" onclick="onKPIClick('${t.label}')">
      <div class="kpi-card-top">
        <div class="kpi-label">${t.label}</div>

function renderItems(agg) {

function renderLogistics(agg) {

function renderDonutLegend(containerId, data, colors) {

      </div>

}

function renderActivity(podList) {
  // Apply search
  let rows = podList;
  const q  = AppState.actSearch.toLowerCase();
  if (q) {
    rows = rows.filter(p =>
      p.id.toLowerCase().includes(q) ||
      p.store.toLowerCase().includes(q) ||
      p.stNumber.toLowerCase().includes(q) ||
      p.tpl.toLowerCase().includes(q) ||
      p.user.toLowerCase().includes(q)
    );
  }

  // Sort
  const { key, dir } = AppState.actSort;
  rows = [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'qty' || key === 'items') { av = +av; bv = +bv; }
    if (av < bv) return -dir; if (av > bv) return dir; return 0;
  });

  AppState.actRows = rows;
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / AppState.actPageSize));
  AppState.actPage = Math.min(AppState.actPage, pages);
  const start = (AppState.actPage - 1) * AppState.actPageSize;
  const slice = rows.slice(start, start + AppState.actPageSize);

  const body  = document.getElementById('actBody');
  const empty = document.getElementById('actEmpty');

  if (!slice.length) {
    body.innerHTML = '';
    empty.style.display = 'flex';
  } else {
    empty.style.display = 'none';
    body.innerHTML = slice.map(p => {
      const tplClass = 'tpl-' + (p.tpl.split(' ')[0]) || 'default';
      const reviewed = p.reviewedBy && p.reviewedBy !== '';
      return `
        <tr onclick="openDrawer('${escHtml(p.id)}')">
          <td>${escHtml(p.id)}</td>
          <td>${p.date}</td>
          <td>${escHtml(p.store)}</td>
          <td><code style="font-size:11px">${escHtml(p.stNumber)}</code></td>
          <td><span class="tpl-badge ${tplClass}">${escHtml(p.tpl)}</span></td>
          <td><strong>${fmtNum(p.qty)}</strong></td>
          <td>${p.items.length}</td>
          <td>${escHtml(p.user)}</td>
          <td>
            <span class="review-badge ${reviewed ? 'review-yes' : 'review-no'}">
              ${reviewed ? '✓ ' + escHtml(p.reviewedBy) : '⏳ Pending'}
            </span>
          </td>
        </tr>`;
    }).join('');
  }

  document.getElementById('actCount').textContent =
    total + ' POD' + (total !== 1 ? 's' : '') +
    (q ? ' (filtered)' : '');

  renderPagination(pages);
}

function renderPagination(pages) {
  const pg = document.getElementById('actPagination');
  if (!pg) return;
  const cur = AppState.actPage;
  let html = `<button class="pg-btn" onclick="goPage(${cur-1})" ${cur<=1?'disabled':''}>‹</button>`;
  const window = 2;
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - cur) <= window) {
      html += `<button class="pg-btn${i===cur?' active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - cur) === window + 1) {
      html += `<span style="color:#CBD5E1;padding:0 4px">…</span>`;
    }
  }
  html += `<button class="pg-btn" onclick="goPage(${cur+1})" ${cur>=pages?'disabled':''}>›</button>`;
  pg.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   MAIN RENDER ORCHESTRATOR
   ═══════════════════════════════════════════════════════════════ */
function render() {
  const filtered = AppState.getFiltered();

  renderKPIs(agg.kpis);
  renderSnapshot(agg.snapshot);
  renderTrend(agg);
  renderStores(agg);
  renderItems(agg);
  renderLogistics(agg);
  renderTeam(agg);
  renderActivity(agg.podList);

  // Show/hide reset button
  document.getElementById('resetBtn').style.display =
    AppState.hasActiveFilters() ? 'flex' : 'none';
}

/* ═══════════════════════════════════════════════════════════════
   FILTER MANAGEMENT
   ═══════════════════════════════════════════════════════════════ */

function initFilterOptions(opts) {
  AppState.filterOptions = opts;
  buildOptList('store', opts.stores, AppState.filters.stores);
  buildOptList('tpl',   opts.tpls,   AppState.filters.tpls);
  buildOptList('user',  opts.users,   AppState.filters.users);
  buildOptList('stnum', opts.stnums,  AppState.filters.stnums);
}

function buildOptList(key, items, selectedSet, filterStr = '') {
  const container = document.getElementById('fo-' + key);
  if (!container) return;
  const filtered = filterStr
    ? items.filter(i => i.toLowerCase().includes(filterStr.toLowerCase()))
    : items;
  container.innerHTML = filtered.map(item => `
    <label class="opt-item${selectedSet.has(item) ? ' checked' : ''}" onclick="toggleOption('${key}','${escAttr(item)}',this)">
      <input type="checkbox" ${selectedSet.has(item) ? 'checked' : ''} onclick="event.stopPropagation()">
      <span>${escHtml(item)}</span>
    </label>`).join('');
}

function toggleOption(key, value, el) {
  const setMap = { store:'stores', tpl:'tpls', user:'users', stnum:'stnums' };
  const set = AppState.filters[setMap[key]];
  if (set.has(value)) {
    set.delete(value);
    el.classList.remove('checked');
    el.querySelector('input').checked = false;
  } else {
    set.add(value);
    el.classList.add('checked');
    el.querySelector('input').checked = true;
  }
  updateFilterLabel(key, set);
  updateFilterCount(key, set);
  AppState.actPage = 1;
  render();
}

function updateFilterLabel(key, set) {
  const labels = { store:'All Stores', tpl:'All 3PL', user:'All Users', stnum:'All ST#' };
  const el = document.getElementById('flbl-' + key);
  if (!el) return;
  if (set.size === 0) el.textContent = labels[key];
  else if (set.size === 1) el.textContent = [...set][0].split(' ').slice(0,2).join(' ');
  else el.textContent = labels[key].replace('All ', '') + ' (' + set.size + ')';
}

function updateFilterCount(key, set) {
  const fc = document.getElementById('fc-' + key);
  const fb = document.getElementById('fb-' + key);
  if (!fc || !fb) return;
  if (set.size > 0) {
    fc.textContent = set.size;
    fc.style.display = '';
    fb.classList.add('active');
  } else {
    fc.style.display = 'none';
    fb.classList.remove('active');
  }
}

function updateFilterUI() {
  const f = AppState.filters;
  // Date
  const lblDate = document.getElementById('flbl-date');
  if (lblDate) {
    if (!f.dateFrom && !f.dateTo) lblDate.textContent = 'All Dates';
    else if (f.dateFrom === f.dateTo) lblDate.textContent = f.dateFrom;
    else lblDate.textContent = (f.dateFrom || '…') + ' → ' + (f.dateTo || '…');
  }
  document.getElementById('resetBtn').style.display =
    AppState.hasActiveFilters() ? 'flex' : 'none';
}

function toggleFilter(key, e) {
  if (e) e.stopPropagation();
  const fg = document.getElementById('fg-' + key);
  const isOpen = fg.classList.contains('open');
  closeAllFilters();
  if (!isOpen) {
    fg.classList.add('open');
    document.getElementById('filterBackdrop').style.display = 'block';
  }
}

function closeAllFilters() {
  document.querySelectorAll('.fg.open').forEach(el => el.classList.remove('open'));
  document.getElementById('filterBackdrop').style.display = 'none';
}

function selectAll(key) {
  const setMap = { store:'stores', tpl:'tpls', user:'users', stnum:'stnums' };
  const opts   = AppState.filterOptions;
  const optsMap = { store: opts.stores, tpl: opts.tpls, user: opts.users, stnum: opts.stnums };
  const set    = AppState.filters[setMap[key]];
  optsMap[key].forEach(v => set.add(v));
  buildOptList(key, optsMap[key], set);
  updateFilterLabel(key, set);
  updateFilterCount(key, set);
  AppState.actPage = 1;
  render();
}

function clearFilter(key) {
  const setMap = { store:'stores', tpl:'tpls', user:'users', stnum:'stnums' };
  const set = AppState.filters[setMap[key]];
  set.clear();
  const opts = AppState.filterOptions;
  const optsMap = { store: opts.stores, tpl: opts.tpls, user: opts.users, stnum: opts.stnums };
  buildOptList(key, optsMap[key], set);
  updateFilterLabel(key, set);
  updateFilterCount(key, set);
  AppState.actPage = 1;
  render();
}

function searchOptions(key, q) {
  const opts   = AppState.filterOptions;
  const optsMap = { store: opts.stores, tpl: opts.tpls, user: opts.users, stnum: opts.stnums };
  const setMap  = { store:'stores', tpl:'tpls', user:'users', stnum:'stnums' };
  buildOptList(key, optsMap[key], AppState.filters[setMap[key]], q);
}

function setDatePreset(days) {
  const f = AppState.filters;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  const btn = days === 0 ? 'pr-all' : days === 1 ? 'pr-1' : days === 7 ? 'pr-7' : 'pr-30';
  const pbtn = document.getElementById(btn);
  if (pbtn) pbtn.classList.add('active');

  if (days === 0) {
    f.dateFrom = null; f.dateTo = null;
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value   = '';
  } else {
    const today = new Date();
    const from  = new Date(today);
    from.setDate(today.getDate() - (days - 1));
    f.dateFrom = from.toISOString().slice(0, 10);
    f.dateTo   = today.toISOString().slice(0, 10);
    document.getElementById('dateFrom').value = f.dateFrom;
    document.getElementById('dateTo').value   = f.dateTo;
  }
  updateFilterUI();
  AppState.actPage = 1;
  render();
}

function applyDateFilter() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  AppState.filters.dateFrom = from || null;
  AppState.filters.dateTo   = to   || null;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  updateFilterUI();
  AppState.actPage = 1;
  render();
}

function resetAllFilters() {
  const f = AppState.filters;
  f.dateFrom = null; f.dateTo = null;
  f.stores.clear(); f.tpls.clear(); f.users.clear(); f.stnums.clear();
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value   = '';
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pr-all')?.classList.add('active');
  ['store','tpl','user','stnum'].forEach(k => {
    updateFilterLabel(k, new Set());
    updateFilterCount(k, new Set());
  });
  const opts = AppState.filterOptions;
  buildOptList('store', opts.stores, new Set());
  buildOptList('tpl',   opts.tpls,   new Set());
  buildOptList('user',  opts.users,   new Set());
  buildOptList('stnum', opts.stnums,  new Set());
  document.getElementById('flbl-date').textContent = 'All Dates';
  document.getElementById('resetBtn').style.display = 'none';
  AppState.actPage = 1;
  render();
}

function quickFilter(filterKey, value, chartId) {
  // Toggle single value in a filter set
  const set = AppState.filters[filterKey];
  const wasActive = set.has(value) && set.size === 1;
  set.clear();
  if (!wasActive) set.add(value);
  const uiKey = filterKey === 'stores' ? 'store' : filterKey === 'tpls' ? 'tpl' : filterKey === 'users' ? 'user' : 'stnum';
  const opts = AppState.filterOptions;
  const optsMap = { store: opts.stores, tpl: opts.tpls, user: opts.users, stnum: opts.stnums };
  buildOptList(uiKey, optsMap[uiKey] || [], set);
  updateFilterLabel(uiKey, set);
  updateFilterCount(uiKey, set);
  AppState.actPage = 1;
  render();
}

            ${reviewed ? '✓ ' + escHtml(reviewed) : '⏳ Pending Review'}

function exportCSV() {
  const rows    = AppState.actRows;
  const headers = ['POD ID','Date','Store','ST Number','3PL','Total Qty','Items','Submitted By'];
  const lines   = [headers.join(',')].concat(
    rows.map(p => [p.id, p.date, p.store, p.stNumber, p.tpl, p.qty, p.items.length, p.user]
      .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))
  );
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'wh_qc_export_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function loadData() {
  document.getElementById('lastRefreshText').textContent = 'Loading…';
  document.getElementById('skeleton').style.display  = 'block';
  document.getElementById('dashboard').style.display = 'none';

  google.script.run
    .withSuccessHandler(onDataLoaded)
    .withFailureHandler(onDataError)
    .getSheetData();
}

function onDataLoaded(result) {
  if (result.error) { onDataError(result.error); return; }

  AppState.raw = result.rows || [];
  const opts   = DataEngine.buildFilterOptions(AppState.raw);
  initFilterOptions(opts);

  document.getElementById('skeleton').style.display  = 'none';
  document.getElementById('dashboard').style.display = 'block';

  // Set date range from data
  const dates = AppState.raw.map(r => r[1]).filter(Boolean).sort();
  if (dates.length) {
    document.getElementById('dateFrom').min = dates[0];
    document.getElementById('dateTo').max   = dates[dates.length - 1];
  }

  render();

  const ts = new Date(result.ts);
  document.getElementById('lastRefreshText').textContent =
    'Updated ' + ts.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  document.querySelector('.refresh-dot')?.classList.add('live');
}

function onDataError(err) {
  console.error('Data load error:', err);
  document.getElementById('lastRefreshText').textContent = 'Load failed — retry';
  document.getElementById('skeleton').innerHTML =
    '<div style="padding:48px;text-align:center;color:#94A3B8">' +
    '<div style="font-size:32px;margin-bottom:12px">⚠️</div>' +
    '<div style="font-size:14px;font-weight:600;color:#64748B;margin-bottom:8px">Failed to load data</div>' +
    '<div style="font-size:12px;color:#CBD5E1;margin-bottom:16px">' + String(err) + '</div>' +
    '<button onclick="loadData()" style="padding:8px 20px;background:#FF6B00;color:#fff;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer">Retry</button>' +
    '</div>';
}

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════ */
function fmtNum(n) {
  return Number(n).toLocaleString();
}
function fmtShort(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n;
}
function truncate(s, n) {
  return String(s).length > n ? String(s).slice(0, n) + '…' : String(s);
}
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function() {
  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeDrawer(); closeAllFilters(); }
  });

  // Intersection Observer for nav highlighting
  const sections = ['kpis','snapshot','trend','stores','items','logistics','team','activity'];
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('sec-','');
        document.querySelectorAll('.nav-item').forEach(n => {
          n.classList.toggle('active', n.getAttribute('data-section') === id);
        });
      }
    });
  }, { threshold: 0.3 });

  sections.forEach(id => {
    const el = document.getElementById('sec-' + id);
    if (el) observer.observe(el);
  });

  // Load data
  if (typeof google !== 'undefined' && google.script) {
    loadData();
  } else {
    // Dev mode: load with sample data
    onDataLoaded({ rows: [], ts: Date.now() });
  }
});
</script>
