<style>
/* ═══════════════════════════════════════════════════
   Talabat Warehouse QC — Dashboard Stylesheet
   ═══════════════════════════════════════════════════ */

/* ── Reset & Base ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#F1F5F9;color:#1E293B;height:100vh;overflow:hidden;line-height:1.5}
a{text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
canvas{display:block}

/* ── App Shell ────────────────────────────────────── */
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .25s ease}
.app.collapsed{grid-template-columns:60px 1fr}

/* ── Sidebar ──────────────────────────────────────── */
.sidebar{
  background:#0F172A;
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  border-right:1px solid rgba(255,255,255,.06);
  transition:width .25s ease;z-index:20;
}
.sidebar-top{padding:18px 16px 10px;flex-shrink:0}
.sidebar-logo{display:flex;align-items:center;gap:10px}
.logo-icon{flex-shrink:0}
.logo-brand{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:#64748B;font-weight:500;margin-top:1px;text-transform:uppercase;letter-spacing:.05em}
.logo-text{overflow:hidden}

/* Collapsed state */
.app.collapsed .logo-text,
.app.collapsed .nav-label,
.app.collapsed .nav-section-label,
.app.collapsed .sidebar-footer .refresh-info span:last-child{display:none}
.app.collapsed .sidebar-nav{padding:0 8px}
.app.collapsed .nav-item{justify-content:center;padding:10px 0;border-radius:8px}
.app.collapsed .nav-icon{margin:0}

/* Navigation */
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-section-label{
  font-size:10px;font-weight:600;color:#334155;
  letter-spacing:.08em;padding:14px 6px 6px;text-transform:uppercase
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;
  color:#94A3B8;font-size:13px;font-weight:500;
  transition:background .15s,color .15s;white-space:nowrap;overflow:hidden
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#E2E8F0}
.nav-item.active{background:rgba(255,107,0,.15);color:#FF6B00}
.nav-item.active .nav-icon{color:#FF6B00}
.nav-icon{width:16px;height:16px;flex-shrink:0;color:currentColor}

/* Sidebar footer */
.sidebar-footer{
  padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0
}
.refresh-info{display:flex;align-items:center;gap:6px;overflow:hidden}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:#64748B;flex-shrink:0}
.refresh-dot.live{background:#22C55E;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.refresh-info span:last-child{font-size:11px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-refresh-btn{
  color:#475569;padding:4px;border-radius:6px;transition:color .15s,background .15s;flex-shrink:0
}
.sidebar-refresh-btn:hover{color:#94A3B8;background:rgba(255,255,255,.06)}

/* ── Main Wrapper ─────────────────────────────────── */
.main-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#F1F5F9}

/* ── Topbar ───────────────────────────────────────── */
.topbar{
  background:#fff;border-bottom:1px solid #E2E8F0;
  padding:0 20px;height:58px;display:flex;align-items:center;
  gap:16px;flex-shrink:0;z-index:15;position:sticky;top:0;
}
.topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
.hamburger{
  color:#64748B;padding:6px;border-radius:7px;
  transition:background .15s,color .15s;display:flex;
}
.hamburger:hover{background:#F1F5F9;color:#1E293B}
.topbar-title{font-size:15px;font-weight:700;color:#1E293B;white-space:nowrap}
.topbar-sub{font-size:11px;color:#94A3B8;white-space:nowrap}

/* Filters */
.topbar-filters{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.topbar-filters::-webkit-scrollbar{display:none}

.fg{position:relative}
.filter-btn{
  display:flex;align-items:center;gap:5px;padding:6px 10px;
  background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;
  font-size:12px;font-weight:500;color:#475569;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.filter-btn:hover{background:#F1F5F9;border-color:#CBD5E1;color:#1E293B}
.filter-btn.active{background:#FFF7ED;border-color:#FDBA74;color:#C2410C}
.filter-btn svg{flex-shrink:0;color:currentColor}
.chevron{transition:transform .2s;flex-shrink:0}
.fg.open .chevron{transform:rotate(180deg)}
.filter-count{
  background:#FF6B00;color:#fff;font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:20px;line-height:1.4
}

/* Filter Panel */
.filter-panel{
  position:absolute;top:calc(100% + 6px);left:0;min-width:200px;
  background:#fff;border:1px solid #E2E8F0;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;display:none;
  overflow:hidden;animation:fadeDown .15s ease
}
.filter-panel.wide-panel{min-width:260px}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fg.open .filter-panel{display:block}

.date-presets{display:flex;gap:4px;padding:10px 10px 6px;flex-wrap:wrap}
.preset-btn{
  padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;
  color:#64748B;border:1px solid #E2E8F0;background:#F8FAFC;transition:all .15s
}
.preset-btn:hover,.preset-btn.active{background:#FFF7ED;border-color:#FDBA74;color:#C2410C}
.date-range-inputs{display:flex;flex-direction:column;gap:6px;padding:6px 10px 10px}
.date-label{font-size:11px;color:#64748B;font-weight:500;display:flex;flex-direction:column;gap:3px}
.date-label input{
  padding:6px 8px;border:1px solid #E2E8F0;border-radius:6px;
  font-size:12px;color:#1E293B;background:#F8FAFC;
}
.date-label input:focus{outline:none;border-color:#FF6B00;background:#fff}

.fp-search{padding:8px 10px 4px}
.fp-search input{
  width:100%;padding:6px 10px;border:1px solid #E2E8F0;
  border-radius:7px;font-size:12px;color:#1E293B;background:#F8FAFC;
}
.fp-search input:focus{outline:none;border-color:#FF6B00}
.fp-actions{
  display:flex;gap:6px;padding:6px 10px;
  border-bottom:1px solid #F1F5F9;
}
.fp-actions button{
  font-size:11px;color:#FF6B00;font-weight:600;
  padding:2px 6px;border-radius:4px;transition:background .15s
}
.fp-actions button:hover{background:#FFF7ED}
.fp-opts{max-height:200px;overflow-y:auto;padding:4px 6px 6px;scrollbar-width:thin}
.opt-item{
  display:flex;align-items:center;gap:8px;padding:6px 6px;
  border-radius:6px;cursor:pointer;transition:background .1s;font-size:12px;color:#475569
}
.opt-item:hover{background:#F8FAFC}
.opt-item input[type=checkbox]{accent-color:#FF6B00;width:13px;height:13px;flex-shrink:0}
.opt-item.checked{color:#1E293B;font-weight:500}

.filter-backdrop{position:fixed;inset:0;z-index:90}

/* Reset button */
.reset-btn{
  display:flex;align-items:center;gap:5px;padding:6px 10px;
  background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;
  font-size:12px;font-weight:600;color:#DC2626;white-space:nowrap;
  transition:background .15s;flex-shrink:0
}
.reset-btn:hover{background:#FEE2E2}

.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid #E2E8F0;
  background:#F8FAFC;color:#64748B;display:flex;align-items:center;justify-content:center;
  transition:all .15s
}
.icon-btn:hover{background:#F1F5F9;color:#1E293B;border-color:#CBD5E1}

/* ── Content ──────────────────────────────────────── */
.content{flex:1;overflow-y:auto;padding:20px 24px 40px;scroll-behavior:smooth}

/* Sections */
.section{margin-bottom:28px}
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-bar{width:3px;height:18px;background:#FF6B00;border-radius:2px;flex-shrink:0}
.section-pulse{width:8px;height:8px;border-radius:50%;background:#22C55E;flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.section-title{font-size:15px;font-weight:700;color:#1E293B}
.section-badge{font-size:11px;color:#94A3B8;background:#F1F5F9;padding:3px 8px;border-radius:20px;font-weight:500}
.seg-ctrl{display:flex;gap:2px;background:#F1F5F9;padding:2px;border-radius:8px;margin-left:auto}
.seg-btn{font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;color:#64748B;transition:all .15s}
.seg-btn.active{background:#fff;color:#1E293B;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.active-filter-chip{
  font-size:11px;padding:3px 10px;border-radius:20px;
  background:#FFF7ED;color:#C2410C;border:1px solid #FDBA74;font-weight:600
}

/* ── Skeleton ─────────────────────────────────────── */
.sk-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sk-chart-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:900px){.sk-kpi-row{grid-template-columns:repeat(2,1fr)}}
.sk-box{
  background:#fff;border-radius:12px;
  background:linear-gradient(90deg,#E2E8F0 25%,#F1F5F9 50%,#E2E8F0 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border:1px solid #E2E8F0
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── KPI Grid ─────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{
  background:#fff;border:1px solid #E2E8F0;border-radius:12px;
  padding:16px 20px;display:flex;flex-direction:column;gap:8px;
  transition:box-shadow .2s,transform .15s;cursor:pointer;position:relative;overflow:hidden
}
.kpi-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
.kpi-card.kpi-alert{border-color:#FECACA;background:linear-gradient(135deg,#fff 0%,#FEF2F2 100%)}
.kpi-card.kpi-active{border-color:#FF6B00;box-shadow:0 0 0 2px rgba(255,107,0,.15)}
.kpi-card-top{display:flex;align-items:flex-start;justify-content:space-between}
.kpi-icon-wrap{
  width:36px;height:36px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;flex-shrink:0
}
.kpi-label{font-size:11px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:26px;font-weight:800;color:#1E293B;letter-spacing:-.5px;line-height:1.15}
.kpi-card.kpi-alert .kpi-value{color:#DC2626}
.kpi-sub{font-size:11px;color:#94A3B8;display:flex;align-items:center;gap:4px}
.kpi-trend-up{color:#16A34A}
.kpi-trend-down{color:#DC2626}

/* ── Snapshot ─────────────────────────────────────── */
.snapshot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.snapshot-grid{grid-template-columns:repeat(2,1fr)}}
.snap-card{
  background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);
  border-radius:12px;padding:16px 18px;color:#fff;
  display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden
}
.snap-card::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,.04)
}
.snap-label{font-size:11px;color:#64748B;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.snap-value{font-size:28px;font-weight:800;color:#fff;line-height:1.2}
.snap-sub{font-size:11px;color:#475569}

/* ── Chart Cards ──────────────────────────────────── */
.chart-card{
  background:#fff;border:1px solid #E2E8F0;border-radius:12px;
  padding:18px 20px;overflow:hidden
}
.chart-card--tall{padding-bottom:24px}
.chart-card.no-pad{padding:0}
.chart-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.chart-card-title{font-size:13px;font-weight:700;color:#1E293B}
.chart-tag{font-size:11px;color:#94A3B8;background:#F8FAFC;border:1px solid #E2E8F0;padding:2px 8px;border-radius:20px}
.chart-wrap{position:relative;height:260px}
.chart-card--tall .chart-wrap{height:300px}

/* Trend legend */
.chart-legend-row{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.legend-item{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:#475569;cursor:pointer;padding:3px 8px;border-radius:6px;
  transition:background .15s
}
.legend-item:hover{background:#F8FAFC}
.legend-item.hidden{opacity:.4}
.legend-dot{width:12px;height:3px;border-radius:2px;flex-shrink:0}

/* Donut charts */
.donut-wrap{position:relative;height:180px;display:flex;align-items:center;justify-content:center}
.donut-legend{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.dl-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#475569}
.dl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-right:7px}
.dl-label{display:flex;align-items:center;overflow:hidden}
.dl-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-pct{font-weight:700;color:#1E293B;flex-shrink:0;margin-left:auto}

/* Layouts */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:960px){.two-col,.three-col{grid-template-columns:1fr}}

/* ── User Detail Grid ─────────────────────────────── */
.user-detail-grid{display:flex;flex-direction:column;gap:8px}
.user-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:#F8FAFC;border-radius:9px;border:1px solid #F1F5F9
}
.user-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#FF6B00,#F97316);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0
}
.user-info{flex:1;overflow:hidden}
.user-name{font-size:12px;font-weight:600;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-pods{font-size:11px;color:#94A3B8}
.user-bar-wrap{width:80px;height:4px;background:#E2E8F0;border-radius:2px;flex-shrink:0}
.user-bar{height:100%;border-radius:2px;background:#FF6B00;transition:width .4s ease}

/* ── Activity Table ───────────────────────────────── */
.act-table-wrap{overflow-x:auto}
.act-table{width:100%;border-collapse:collapse;min-width:700px}
.act-table thead th{
  padding:11px 14px;text-align:left;font-size:11px;font-weight:700;
  color:#64748B;text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid #E2E8F0;background:#F8FAFC;
  white-space:nowrap;position:sticky;top:0;z-index:2
}
.act-table th.sortable{cursor:pointer;user-select:none;transition:color .15s}
.act-table th.sortable:hover{color:#1E293B}
.sort-arr{margin-left:4px;font-size:10px;color:#CBD5E1}
.act-table tbody tr{
  cursor:pointer;transition:background .1s;border-bottom:1px solid #F1F5F9
}
.act-table tbody tr:last-child{border-bottom:none}
.act-table tbody tr:hover{background:#FFF7ED}
.act-table td{padding:10px 14px;font-size:12px;color:#475569;white-space:nowrap}
.act-table td:first-child{font-weight:700;color:#1E293B;font-family:monospace;font-size:11px}
.tpl-badge{
  display:inline-flex;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em
}
.tpl-Trella{background:#EFF6FF;color:#1D4ED8}
.tpl-Logistaway{background:#F0FDF4;color:#15803D}
.tpl-NAQLA{background:#FFFBEB;color:#B45309}
.tpl-default{background:#F8FAFC;color:#475569}
.review-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600
}
.review-yes{background:#F0FDF4;color:#16A34A}
.review-no{background:#FEF2F2;color:#DC2626}

.empty-state{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:48px;color:#94A3B8;font-size:13px;
}
.act-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-top:1px solid #E2E8F0;
  font-size:12px;color:#94A3B8
}
.pagination{display:flex;gap:4px}
.pg-btn{
  padding:4px 10px;border-radius:6px;border:1px solid #E2E8F0;
  font-size:12px;font-weight:500;color:#475569;background:#F8FAFC;
  transition:all .15s
}
.pg-btn:hover,.pg-btn.active{background:#FF6B00;border-color:#FF6B00;color:#fff}
.pg-btn:disabled{opacity:.4;pointer-events:none}

/* ── Drawer ───────────────────────────────────────── */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.5);
  z-index:200;opacity:0;pointer-events:none;transition:opacity .25s
}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:480px;max-width:95vw;
  background:#fff;z-index:201;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 32px rgba(0,0,0,.15)
}
.drawer.open{transform:translateX(0)}
.drawer-hdr{
  padding:20px 22px 16px;border-bottom:1px solid #E2E8F0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0
}
.drawer-title{font-size:15px;font-weight:700;color:#1E293B;font-family:monospace}
.drawer-sub{font-size:12px;color:#94A3B8;margin-top:3px}
.drawer-close{
  width:30px;height:30px;border-radius:7px;background:#F8FAFC;
  border:1px solid #E2E8F0;color:#64748B;display:flex;
  align-items:center;justify-content:center;transition:all .15s;flex-shrink:0
}
.drawer-close:hover{background:#FEE2E2;border-color:#FECACA;color:#DC2626}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px}

.drawer-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.drawer-meta-item{background:#F8FAFC;border:1px solid #F1F5F9;border-radius:8px;padding:10px 14px}
.drawer-meta-label{font-size:10px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.drawer-meta-value{font-size:13px;font-weight:600;color:#1E293B}
.drawer-items-title{font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.drawer-items-table{width:100%;border-collapse:collapse}
.drawer-items-table th{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-bottom:1px solid #E2E8F0;text-align:left}
.drawer-items-table td{padding:8px 10px;font-size:12px;color:#475569;border-bottom:1px solid #F1F5F9}
.drawer-items-table tr:last-child td{border-bottom:none}
.drawer-items-table td:first-child{font-family:monospace;font-size:11px}
.drawer-items-table td:last-child{font-weight:700;color:#1E293B;text-align:right}
.drawer-total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 10px;background:#F8FAFC;border-radius:8px;margin-top:10px
}
.drawer-total-label{font-size:12px;font-weight:600;color:#64748B}
.drawer-total-value{font-size:16px;font-weight:800;color:#FF6B00}

/* ── No data state ────────────────────────────────── */
.no-data{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:200px;gap:8px;
  color:#CBD5E1;font-size:13px
}

/* ── Scrollbar ────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}
</style>
